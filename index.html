<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<style>:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>TerraScope Care Resilience</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Clickable product prototype: climate and adverse-weather continuity intelligence for adult social care, on the real Lincolnshire care home estate.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;600&family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: an operations console. A fixed left rail of routes beside a working
   canvas of panels; severity rides on ramp chips and a left stripe on each row,
   so what needs attention reads before any number does. */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --surface-2:#edf2f1; --sunk:#e6edec;
  --ink:#13232a; --ink-2:#47595f; --ink-3:#77898e; --line:#d4dfdd; --line-2:#e6edec;
  --accent:#00675f; --accent-hi:#004f49; --accent-ink:#ffffff; --accent-wash:#dcece9;
  --focus:#00675f;

  /* Priority ramp, Low -> Very high (sequential, single warm hue) */
  --p1:#e6bb7e; --p2:#cc7a39; --p3:#9f3f27; --p4:#5e1a1f;
  --p1-ink:#3b2510; --p2-ink:#2a1405; --p3-ink:#ffffff; --p4-ink:#ffffff;
  /* EA flood ramp, Very low -> High (sequential, single blue hue) */
  --f1:#b8d4ea; --f2:#6fa3cf; --f3:#2f6aa3; --f4:#0f325a;
  --f1-ink:#102a40; --f2-ink:#0b2236; --f3-ink:#ffffff; --f4-ink:#ffffff;
  /* UKHSA alert levels, their own published vocabulary */
  --ua-green:#2f7d4f; --ua-yellow:#c9a400; --ua-amber:#d9781a; --ua-red:#b4232a;
  --ua-yellow-ink:#2b2300;
  /* State */
  --ok:#2f7d4f; --warn:#b06a14; --crit:#a5302b; --pending:#8a979b;
  --ok-wash:#e2f1e8; --warn-wash:#fbefdd; --crit-wash:#f8e3e1;

  --display:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --body:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:"Atkinson Hyperlegible Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;

  --r:6px; --r-sm:4px;
  --shadow:0 1px 2px rgba(19,35,42,.06),0 6px 20px rgba(19,35,42,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#111a19; --surface:#17211f; --surface-2:#1d2927; --sunk:#0d1514;
  --ink:#e4ecea; --ink-2:#a9b9b6; --ink-3:#7e908c; --line:#2b3a37; --line-2:#22302d;
  --accent:#4cc2b3; --accent-hi:#7fd8cc; --accent-ink:#06201d; --accent-wash:#163631;
  --focus:#7fd8cc;
  --p1:#4e3f33; --p2:#9a5428; --p3:#e3864d; --p4:#ffc4aa;
  --p1-ink:#f3e3d4; --p2-ink:#fff1e6; --p3-ink:#1d0d03; --p4-ink:#2a0d06;
  --f1:#2a4560; --f2:#3f72a3; --f3:#6aa6db; --f4:#b6dbff;
  --f1-ink:#dbeaf7; --f2-ink:#f1f7fd; --f3-ink:#06182a; --f4-ink:#06182a;
  --ua-green:#4fae75; --ua-yellow:#e3c23a; --ua-amber:#f0974a; --ua-red:#e2585a;
  --ua-yellow-ink:#231c00;
  --ok:#5cbb84; --warn:#e6a04a; --crit:#ec7a72; --pending:#7e908c;
  --ok-wash:#173327; --warn-wash:#3a2a14; --crit-wash:#3b1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111a19; --surface:#17211f; --surface-2:#1d2927; --sunk:#0d1514;
  --ink:#e4ecea; --ink-2:#a9b9b6; --ink-3:#7e908c; --line:#2b3a37; --line-2:#22302d;
  --accent:#4cc2b3; --accent-hi:#7fd8cc; --accent-ink:#06201d; --accent-wash:#163631;
  --focus:#7fd8cc;
  --p1:#4e3f33; --p2:#9a5428; --p3:#e3864d; --p4:#ffc4aa;
  --p1-ink:#f3e3d4; --p2-ink:#fff1e6; --p3-ink:#1d0d03; --p4-ink:#2a0d06;
  --f1:#2a4560; --f2:#3f72a3; --f3:#6aa6db; --f4:#b6dbff;
  --f1-ink:#dbeaf7; --f2-ink:#f1f7fd; --f3-ink:#06182a; --f4-ink:#06182a;
  --ua-green:#4fae75; --ua-yellow:#e3c23a; --ua-amber:#f0974a; --ua-red:#e2585a;
  --ua-yellow-ink:#231c00;
  --ok:#5cbb84; --warn:#e6a04a; --crit:#ec7a72; --pending:#7e908c;
  --ok-wash:#173327; --warn-wash:#3a2a14; --crit-wash:#3b1d1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
  z-index:40;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:23px;font-weight:700;line-height:1.2}
h2{font-size:16px;font-weight:700}
h3{font-size:14.5px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.small{font-size:13px}
.xs{font-size:12px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:3px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

/* ------------------------------------------------------------ shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));
  background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;
  padding:18px 14px 14px max(14px,env(safe-area-inset-left,0px));gap:16px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 4px}
.mark{width:30px;height:30px;flex:none}
.brand b{font:700 16px/1.1 var(--display);letter-spacing:-.01em;display:block}
.brand span{font-size:11.5px;color:var(--ink-3)}
.scope{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;
  display:flex;flex-direction:column;gap:7px}
.scope label{font-size:11.5px;color:var(--ink-2);font-weight:600;letter-spacing:.02em}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:var(--r-sm);padding:2px;gap:2px}
.seg button{border:0;background:transparent;padding:6px 4px;border-radius:3px;font-size:12.5px;
  color:var(--ink-2);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12);font-weight:600}
.scope select{width:100%;padding:6px 7px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-size:13px}
.scope .note{font-size:11.5px;color:var(--ink-3);line-height:1.4}
nav.routes{display:flex;flex-direction:column;gap:2px}
nav.routes a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);
  color:var(--ink-2);text-decoration:none;font-size:14px;font-weight:500}
nav.routes a:hover{background:var(--surface-2);color:var(--ink)}
nav.routes a[aria-current="page"]{background:var(--accent-wash);color:var(--accent-hi);font-weight:700}
nav.routes svg{width:17px;height:17px;flex:none}
nav.routes .count{margin-left:auto;font:600 11px var(--mono);background:var(--surface-2);
  border:1px solid var(--line);border-radius:10px;padding:0 6px;color:var(--ink-2)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;font-size:11.5px;color:var(--ink-3)}
.rail-foot button{align-self:flex-start;border:1px solid var(--line);background:var(--surface);
  border-radius:var(--r-sm);padding:5px 9px;font-size:12px;color:var(--ink-2);cursor:pointer}

main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;
  padding-block:10px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.search{position:relative;flex:1;max-width:420px;min-width:0}
.search input{width:100%;padding:8px 10px 8px 32px;border:1px solid var(--line);border-radius:var(--r);
  background:var(--surface-2);font-size:14px}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--ink-3)}
.results{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);max-height:340px;overflow:auto;z-index:30}
.results a{display:block;padding:8px 11px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--line-2)}
.results a:hover,.results a.on{background:var(--accent-wash)}
.results a small{display:block;color:var(--ink-3);font-size:12px}
.topbar .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);
  color:var(--ink);border-radius:var(--r-sm);padding:7px 12px;font-size:13.5px;font-weight:600;cursor:pointer;
  white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hi);border-color:var(--accent-hi)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn svg{width:15px;height:15px}
.btn[disabled]{opacity:.5;cursor:not-allowed}

.status-strip{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;background:var(--warn-wash);
  border-bottom:1px solid var(--line);font-size:12.5px;color:var(--ink);
  padding-block:7px;padding-left:max(22px,env(safe-area-inset-left,0px));padding-right:max(22px,env(safe-area-inset-right,0px))}
.status-strip b{font-weight:700}
.status-strip button{border:0;background:none;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font-size:12.5px}

.page{padding-block:22px 60px;padding-left:max(22px,env(safe-area-inset-left,0px));
  padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px;
  max-width:1320px;width:100%}
.phead{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end;justify-content:space-between}
.phead .sub{color:var(--ink-2);font-size:14px;margin-top:4px;max-width:70ch}
.crumbs{font-size:12.5px;color:var(--ink-3);margin-bottom:5px}
.crumbs a{color:var(--ink-2);text-decoration:none}
.crumbs a:hover{text-decoration:underline}
.actions-row{display:flex;flex-wrap:wrap;gap:8px}

/* ------------------------------------------------------------ panels */
.grid{display:grid;gap:16px}
.g-2{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g-2e{grid-template-columns:repeat(2,minmax(0,1fr))}
.g-3{grid-template-columns:repeat(3,minmax(0,1fr))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:12px 16px;border-bottom:1px solid var(--line-2)}
.panel-h .meta{font-size:12px;color:var(--ink-3)}
.panel-b{padding:14px 16px}
.panel-b.flush{padding:0}

/* KPI tiles: the overview is a summary, so these figures are its point */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:0;background:var(--surface);
  border:1px solid var(--line);border-radius:var(--r)}
.kpi{padding:13px 15px;border-left:1px solid var(--line-2);min-width:0}
.kpi:first-child{border-left:0}
.kpi .v{font:700 24px/1.1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:12.5px;color:var(--ink-2);margin-top:3px}
.kpi .s{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.kpi.attn .v{color:var(--crit)}
.meter{height:5px;background:var(--sunk);border-radius:3px;margin-top:7px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font:700 11.5px/1 var(--body);padding:4px 8px;
  border-radius:3px;white-space:nowrap;letter-spacing:.01em}
.chip.p1{background:var(--p1);color:var(--p1-ink)} .chip.p2{background:var(--p2);color:var(--p2-ink)}
.chip.p3{background:var(--p3);color:var(--p3-ink)} .chip.p4{background:var(--p4);color:var(--p4-ink)}
.chip.f1{background:var(--f1);color:var(--f1-ink)} .chip.f2{background:var(--f2);color:var(--f2-ink)}
.chip.f3{background:var(--f3);color:var(--f3-ink)} .chip.f4{background:var(--f4);color:var(--f4-ink)}
.chip.f0{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip.pending{background:repeating-linear-gradient(135deg,var(--surface-2) 0 5px,var(--sunk) 5px 10px);
  color:var(--ink-2);border:1px solid var(--line)}
.chip.ok{background:var(--ok-wash);color:var(--ok)} .chip.warn{background:var(--warn-wash);color:var(--warn)}
.chip.crit{background:var(--crit-wash);color:var(--crit)}
.chip.plain{background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.ua{display:inline-flex;align-items:center;gap:6px;font:700 12px/1 var(--body);padding:5px 9px;border-radius:3px;color:#fff}
.ua.green{background:var(--ua-green)} .ua.yellow{background:var(--ua-yellow);color:var(--ua-yellow-ink)}
.ua.amber{background:var(--ua-amber);color:#1f1200} .ua.red{background:var(--ua-red)}

/* list rows with severity stripe */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:10px 16px 10px 13px;border-bottom:1px solid var(--line-2);border-left:3px solid transparent;
  text-decoration:none;color:inherit;cursor:pointer}
.row:last-child{border-bottom:0}
.row:hover{background:var(--surface-2)}
.row .rk{font:12px var(--mono);color:var(--ink-3);text-align:right}
.row .nm{font-weight:700;font-size:14.5px;line-height:1.3}
.row .sb{font-size:12.5px;color:var(--ink-2);margin-top:2px}
.row .rt{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.row .score{font:700 16px var(--mono);min-width:44px;text-align:right}
.s-p1{border-left-color:var(--p1)} .s-p2{border-left-color:var(--p2)}
.s-p3{border-left-color:var(--p3)} .s-p4{border-left-color:var(--p4)}

/* tables */
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--ink-2);padding:9px 12px;
  border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
th button{border:0;background:none;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;gap:4px;align-items:center}
th button:hover{color:var(--ink)}
td{padding:9px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--surface-2)}
td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right}
th.n{text-align:right}
.tname{font-weight:700}
.tsub{font-size:12px;color:var(--ink-3)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:11.5px;font-weight:700;color:var(--ink-2)}
.field select,.field input,.field textarea{padding:7px 9px;border:1px solid var(--line);border-radius:var(--r-sm);
  background:var(--surface);font-size:13.5px;min-width:0}
.field textarea{resize:vertical;min-height:60px}
.count-line{margin-left:auto;font:12.5px var(--mono);color:var(--ink-3)}

/* map */
.mapbox{position:relative}
svg.map{display:block;width:100%;height:auto;background:var(--surface-2);border-radius:var(--r-sm)}
svg.map .pt{cursor:pointer;transition:r .12s}
svg.map .pt:hover{stroke:var(--ink);stroke-width:1.5}
svg.map text{fill:var(--ink-3);font:10px var(--mono)}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:12px;
  padding:6px 9px;border-radius:4px;white-space:nowrap;transform:translate(-50%,calc(-100% - 10px));z-index:5}
.tip b{display:block;font-size:12.5px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-2);margin-top:9px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* bars */
.hbars{display:flex;flex-direction:column;gap:9px}
.hbar{display:grid;grid-template-columns:86px minmax(0,1fr) 42px;gap:10px;align-items:center;font-size:13px}
.hbar .track{height:14px;background:var(--sunk);border-radius:3px;position:relative}
.hbar .fill{position:absolute;inset:0 auto 0 0;border-radius:0 4px 4px 0;min-width:2px}
.hbar .val{font:600 12.5px var(--mono);text-align:right;font-variant-numeric:tabular-nums}

/* attention list */
.attn{display:flex;flex-direction:column}
.attn a{display:flex;gap:10px;align-items:flex-start;padding:10px 16px;border-bottom:1px solid var(--line-2);
  text-decoration:none;color:inherit}
.attn a:last-child{border-bottom:0}
.attn a:hover{background:var(--surface-2)}
.attn .ic{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;
  font:700 11px var(--mono)}
.attn b{font-size:13.5px;display:block}
.attn span{font-size:12.5px;color:var(--ink-2)}

/* site detail */
.site-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:13px;color:var(--ink-2);margin-top:8px}
.facts span b{color:var(--ink);font-weight:600}
.prio{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:center}
.prio-num{font:700 52px/1 var(--mono);letter-spacing:-.04em;font-variant-numeric:tabular-nums;transition:color .3s}
.prio-num.pending{font-size:22px;color:var(--ink-3);letter-spacing:0}
.formula{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;
  font-family:var(--mono);margin-top:4px}
.formula .term{min-width:84px;display:flex;flex-direction:column;align-items:center;background:var(--surface-2);
  border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 11px;min-width:84px}
.formula .term b{font-size:18px;font-variant-numeric:tabular-nums}
.formula .term small{font:11px var(--body);color:var(--ink-3);margin-top:2px}
.formula .op{color:var(--ink-3);font-size:16px}
.formula .term.live{border-color:var(--accent);background:var(--accent-wash)}
.formula .term.flash{animation:flash .9s ease}
@keyframes flash{0%{background:var(--accent);color:var(--accent-ink)}100%{background:var(--accent-wash)}}
.range{margin-top:14px}
.range .track{position:relative;height:8px;background:var(--sunk);border-radius:4px}
.range .span{position:absolute;top:0;bottom:0;background:var(--accent-wash);border:1px solid var(--accent);border-radius:4px}
.range .knob{position:absolute;top:50%;width:15px;height:15px;border-radius:50%;background:var(--accent);
  border:2px solid var(--surface);transform:translate(-50%,-50%);transition:left .45s cubic-bezier(.2,.8,.2,1)}

.hz{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* readiness questionnaire — the signature interaction */
.q{display:flex;flex-direction:column}
.qi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;
  border-bottom:1px solid var(--line-2)}
.qi:last-child{border-bottom:0}

.qi .qh{font-size:12px;color:var(--ink-3);margin-top:2px}
.ans{display:inline-grid;grid-auto-flow:column;background:var(--sunk);border-radius:var(--r-sm);padding:2px;gap:2px}
.ans button{border:0;background:transparent;padding:5px 9px;font-size:12px;font-weight:600;color:var(--ink-2);
  border-radius:3px;cursor:pointer;white-space:nowrap}

.ans button[aria-pressed="true"][data-v="yes"]{background:var(--ok);color:#fff}
.ans button[aria-pressed="true"][data-v="partly"]{background:var(--warn);color:#fff}

.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding-top:12px;margin-top:4px;border-top:1px solid var(--line)}

/* actions */
.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.col{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-weight:700;font-size:13.5px}
.col-h .num{font-size:12px;color:var(--ink-3)}
.cards{display:flex;flex-direction:column;gap:8px;padding:0 10px 10px;min-height:60px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 11px;
  display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--line)}
.card.overdue{border-left-color:var(--crit)}
.card .t{font-size:13.5px;font-weight:700;line-height:1.35}
.card .s{font-size:12px;color:var(--ink-2)}
.card .s a{color:var(--ink-2)}
.card .m{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:11.5px;color:var(--ink-3)}
.card .b{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:20px 16px;text-align:center;color:var(--ink-3);font-size:13px}

.alist{display:flex;flex-direction:column}
.aitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;
  padding:10px 0;border-bottom:1px solid var(--line-2)}
.aitem:last-child{border-bottom:0}
.check{width:20px;height:20px;border:1.5px solid var(--ink-3);border-radius:4px;background:var(--surface);
  cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;flex:none}
.check[aria-checked="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.check svg{width:13px;height:13px}
.done-t{text-decoration:line-through;color:var(--ink-3)}

/* history */
.timeline{display:flex;flex-direction:column;gap:0}
.ev{display:grid;grid-template-columns:14px minmax(0,1fr);gap:11px;padding-bottom:13px;position:relative}
.ev::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:1px;background:var(--line)}
.ev:last-child::before{display:none}
.ev .pin{width:13px;height:13px;border-radius:50%;border:2px solid var(--accent);background:var(--surface);margin-top:3px}
.ev .pin.sys{border-color:var(--ink-3)}
.ev b{font-size:13.5px}
.ev .w{font-size:12px;color:var(--ink-3)}
.ev p{font-size:13px;color:var(--ink-2);margin-top:2px}

/* alerts */
.alert-card{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:16px;align-items:start}
.matrix{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;font:10px var(--mono)}
.matrix div{aspect-ratio:1;border-radius:2px;background:var(--sunk);display:flex;align-items:center;justify-content:center;color:var(--ink-3)}
.matrix div.on{outline:2px solid var(--ink);outline-offset:-1px;color:var(--ink);font-weight:700}
.matrix .lg{background:color-mix(in srgb,var(--ua-green) 32%,var(--sunk))}
.matrix .ly{background:color-mix(in srgb,var(--ua-yellow) 38%,var(--sunk))}
.matrix .la{background:color-mix(in srgb,var(--ua-amber) 40%,var(--sunk))}
.matrix .lr{background:color-mix(in srgb,var(--ua-red) 40%,var(--sunk))}
.maxis{display:flex;justify-content:space-between;font:10px var(--mono);color:var(--ink-3);margin-top:3px}
.scen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.scen button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:var(--r);
  padding:13px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0}
.scen button:hover{border-color:var(--accent)}
.scen button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-wash);box-shadow:inset 0 0 0 1px var(--accent)}
.scen b{font-size:14px}
.scen span{font-size:12.5px;color:var(--ink-2)}
.drill-banner{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;background:var(--warn-wash);
  border:1px solid var(--warn);border-radius:var(--r);padding:12px 15px}
.drill-banner b{font-size:14px}
.prog{flex:1;min-width:160px}
.prog .bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--ok);transition:width .35s}

.resp{display:flex;flex-direction:column}
.resp-item{border-bottom:1px solid var(--line-2)}
.resp-item:last-child{border-bottom:0}
.resp-head{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;align-items:center;
  padding:11px 16px;cursor:pointer;background:none;border:0;width:100%;text-align:left}
.resp-head:hover{background:var(--surface-2)}
.resp-body{padding:0 16px 13px 56px;display:flex;flex-direction:column;gap:7px}
.resp-why{font-size:12.5px;color:var(--ink-2)}
.chk{display:flex;gap:9px;align-items:center;font-size:13px}
.minibar{width:64px;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;display:inline-block;vertical-align:middle}
.minibar i{display:block;height:100%;background:var(--ok)}

/* evidence document */
.doc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:30px 34px;
  max-width:820px;width:100%;font-size:14px;line-height:1.6}
.doc .dh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);
  padding-bottom:12px;margin-bottom:18px}

.doc h3{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);margin:20px 0 8px}
.doc table{font-size:13px;margin-top:4px;display:block;max-width:100%;overflow-x:auto}
.doc td,.doc th{padding:6px 8px;position:static}
.doc .fine{font-size:12px;color:var(--ink-3);border-top:1px solid var(--line);padding-top:12px;margin-top:22px}
.doc ul{margin:4px 0;padding-left:18px}
.stamp{display:inline-block;border:1.5px solid var(--accent);color:var(--accent);font:700 11px var(--mono);
  padding:3px 7px;border-radius:3px;letter-spacing:.04em}

/* method & why */
.prose{max-width:72ch;display:flex;flex-direction:column;gap:11px;font-size:14.5px}
.prose h3{margin-top:8px}
.ledger .lr{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr) 130px 104px;gap:14px;align-items:center;
  padding:11px 16px;border-bottom:1px solid var(--line-2);font-size:13px}
.ledger .lr:last-child{border-bottom:0}
.ledger .lr.h{font-size:11.5px;font-weight:700;color:var(--ink-2);padding-block:8px}
.ledger .ln{font-weight:700;font-size:13.5px}
.ledger .ls{font-size:11.5px;color:var(--ink-3)}
.bandtable td,.bandtable th{position:static}
.incident{border-left:4px solid var(--crit);background:var(--surface);border-top:1px solid var(--line);
  border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-radius:0 var(--r) var(--r) 0;padding:18px 20px}
.incident .when{font:700 11.5px var(--mono);color:var(--crit);letter-spacing:.05em}

.incident .src{font-size:12.5px;color:var(--ink-3)}
.split{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.split>div{padding:16px 18px;min-width:0;background:var(--surface)}
.split>div+div{border-left:1px solid var(--line);background:var(--accent-wash)}
.split h3{font-size:13px;color:var(--ink-2);margin-bottom:10px}
.split>div+div h3{color:var(--accent-hi)}
.steps-m{counter-reset:m;display:flex;flex-direction:column;gap:0;margin-top:10px}
.steps-m div{counter-increment:m;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2);
  padding:6px 0;border-bottom:1px dotted var(--line)}
.steps-m div::before{content:counter(m);width:19px;height:19px;border:1px solid var(--line);border-radius:50%;
  font:11px var(--mono);display:flex;align-items:center;justify-content:center;flex:none;color:var(--ink-3)}
.buyers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.buyer{border-top:2px solid var(--accent);padding-top:10px}
.buyer b{display:block;margin-bottom:4px}
.buyer span{font-size:13px;color:var(--ink-2)}
.roadmap{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rm{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;background:var(--surface)}
.rm.now{border-color:var(--accent);box-shadow:inset 0 3px 0 var(--accent)}
.rm b{display:block;font-size:13.5px}
.rm .w{font:11.5px var(--mono);color:var(--ink-3);display:block;margin-bottom:6px}
.rm ul{margin:6px 0 0;padding-left:16px;font-size:12.5px;color:var(--ink-2)}

/* modal, toast, tour */
.scrim{position:fixed;inset:0;background:rgba(8,16,15,.45);z-index:60;display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);width:min(520px,100%);max-height:90vh;overflow:auto}
.modal .panel-b{display:flex;flex-direction:column;gap:12px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line-2)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:var(--r);font-size:13.5px;z-index:80;
  box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.tour{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));

  box-shadow:var(--shadow);z-index:70}

.tour .nav{display:flex;justify-content:space-between;gap:8px;align-items:center}
.hl{outline:3px solid var(--accent)!important;outline-offset:3px;border-radius:var(--r);transition:outline-color .2s}
.intro{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--surface);
  border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:var(--r);padding:14px 16px}
.intro b{font-size:15px;display:block;margin-bottom:3px}
.intro p{font-size:13.5px;color:var(--ink-2);max-width:78ch}
.copyarea{width:100%;min-height:160px;font:12px var(--mono);border:1px solid var(--line);border-radius:var(--r-sm);

<script>
'use strict';
/* TerraScope Care Resilience — clickable product prototype.

   Every home, address, bed count, flood band and climate figure comes from the
   embedded dataset (CQC directory, Environment Agency NaFRA2, Met Office
   HadUK-Grid, UKHSA alerts). Nothing about a real home is invented. What the
   viewer adds (readiness answers, actions, drills) is entered by them and kept
   only in their browser. Suggested actions are generated from the real hazard
   data and are labelled as suggestions. */

const D = JSON.parse(document.getElementById('data').textContent);
const SITES = D.sites;
const BY = new Map(SITES.map(s => [s.id, s]));
const KEY = 'terrascope-demo-v2';   // v2: full Environment Agency flood join
let FEATURE_HOME;   // chosen from the data below: never hard-coded to a named home
const DEFAULT_PROVIDER = 'The Orders Of St. John Care Trust';

/* ------------------------------------------------------------------ method */
const BAND_SCORE = { High: 92, Medium: 72, Low: 45, 'Very low': 15, None: 5 };
const FLOOD_CLS = { 'Very low': 'f1', Low: 'f2', Medium: 'f3', High: 'f4', None: 'f0' };
const FLOOD_DEF = {
  High: '3.3% or greater annual chance',
  Medium: 'between 1% and 3.3% annual chance',
  Low: 'between 0.1% and 1% annual chance',
  'Very low': 'less than 0.1% annual chance',
  None: 'outside every mapped likelihood band',
};
const PRIO_CLS = { Low: 'p1', Moderate: 'p2', High: 'p3', 'Very high': 'p4' };
const PRIO_ORDER = ['Very high', 'High', 'Moderate', 'Low'];
const QUESTIONS = [
  { id: 'bcp',   t: 'Business continuity plan reviewed in the last 12 months', h: 'Dated and signed off by the registered manager', hz: 'all' },
  { id: 'flood', t: 'Plan covers flooding, including evacuation and access routes', h: 'Includes what happens if the road in is cut off', hz: 'flood' },
  { id: 'heat',  t: 'Hot weather plan with a cool area kept below 26°C', h: 'Area identified and temperature checked last summer', hz: 'heat' },
  { id: 'cold',  t: 'Cold weather plan keeping living areas at 18°C or above', h: 'Heating checked before winter, with a fallback', hz: 'cold' },
  { id: 'power', t: 'Backup power, or a tested arrangement for a power cut', h: 'Generator, or an agreement tested in the last year', hz: 'all' },
  { id: 'aid',   t: 'Mutual aid agreed: a place residents could move to', h: 'And a plan for staff to reach the home', hz: 'all' },
];
const ANS = [['yes', 'Yes'], ['partly', 'Partly'], ['no', 'No'], ['unknown', 'Not sure']];
const GAP = { yes: 0, partly: 0.5, no: 1, unknown: 0.75 };

const sorted = a => [...a].sort((x, y) => x - y);
const pct = (arr, p) => { const s = sorted(arr); return s[Math.min(s.length - 1, Math.floor(p * (s.length - 1)))]; };
const HEATS = SITES.map(s => s.heat), COLDS = SITES.map(s => s.cold);
const HEAT = { min: Math.min(...HEATS), max: Math.max(...HEATS), med: pct(HEATS, .5), p75: pct(HEATS, .75) };
const COLD = { min: Math.min(...COLDS), max: Math.max(...COLDS), med: pct(COLDS, .5), p75: pct(COLDS, .75) };

function hazard(s) {
  const v = [s.rs, s.sw].filter(Boolean).map(b => BAND_SCORE[b]);
  return v.length ? Math.max(...v) : null;
}
function consequenceParts(s) {
  const nursing = /nursing/i.test(s.type);
  const typeAdj = nursing ? 0.12 : -0.03;
  const bedAdj = Math.min(0.10, Math.log1p(s.beds) / 30);
  const m = Math.min(1.25, Math.max(0.75, 1 + typeAdj + bedAdj));
  return { m: +m.toFixed(3), nursing, typeAdj, bedAdj };
}
const consequence = s => consequenceParts(s).m;
function readiness(s) {

/* search */
function initSearch() {
  const inp = document.getElementById('q'), box = document.getElementById('qres');
  let hits = [], on = 0;
  const draw = () => {
    if (!hits.length) { box.hidden = true; return; }
    box.hidden = false;
    box.innerHTML = hits.map((s, i) => `<a href="#site-${s.id}" class="${i === on ? 'on' : ''}">${esc(s.name)}
      <small>${esc(s.town)} · ${esc(s.pc)} · ${esc(s.provider)}</small></a>`).join('');
  };
  inp.addEventListener('input', () => {
    const q = inp.value.trim().toLowerCase(); on = 0;
    hits = q.length < 2 ? [] : inScope().filter(s => `${s.name} ${s.town} ${s.pc} ${s.provider} ${s.id}`.toLowerCase().includes(q)).slice(0, 8);
    draw();
  });
  inp.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { on = Math.min(hits.length - 1, on + 1); draw(); e.preventDefault(); }
    if (e.key === 'ArrowUp') { on = Math.max(0, on - 1); draw(); e.preventDefault(); }
    if (e.key === 'Enter' && hits[on]) { location.hash = '#site-' + hits[on].id; inp.value = ''; hits = []; draw(); inp.blur(); }
    if (e.key === 'Escape') { inp.value = ''; hits = []; draw(); }
  });
  box.addEventListener('click', () => { inp.value = ''; hits = []; draw(); });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) { box.hidden = true; } });
}

function seasonChip() {

  if (m >= 5 && m <= 8) return `<span class="chip plain">Heat-Health alert season · runs to 30 September</span>`;
  const next = m >= 9 ? new Date(y, 10, 1) : new Date(y, 5, 1);
  return `<span class="chip warn">${m >= 9 ? 'Cold' : 'Heat'}-Health alert season opens ${fmt(next)} · in ${days(next)} days</span>`;
}

    <div class="prog"><div class="bar"><i style="width:${total ? done / total * 100 : 0}%"></i></div>
      <div class="lbl">${done} of ${total} checks · ${homesDone} of ${order.length} homes complete</div></div>

    <div class="resp">${order.slice(0, limit).map(({ s, why }, i) => {
      const it = d.items[s.id] || [], c = it.filter(Boolean).length, open = DRILL_OPEN.has(s.id);

      return `<div class="resp-item"><button class="resp-head" data-act="drill-open" data-id="${s.id}" aria-expanded="${open}">
        <span class="rk mono faint">${i + 1}</span>
        <span><span style="font-weight:700">${esc(s.name)}</span> <span class="small muted">· ${esc(s.town)}</span><div class="resp-why">${esc(why)}</div></span>
        <span style="display:flex;gap:8px;align-items:center">${d.kind === 'flood' && b ? prioChip(b) : ''}<span class="minibar"><i style="width:${c / sc.checks.length * 100}%"></i></span><span class="xs mono">${c}/${sc.checks.length}</span></span></button>
        ${open ? `<div class="resp-body">${sc.checks.map((t, j) => `<label class="chk"><button class="check" role="checkbox" aria-checked="${!!it[j]}" data-act="drill-check" data-id="${s.id}" data-j="${j}">${it[j] ? I.tick : ''}</button>${esc(t)}</label>`).join('')}
          <a class="xs" href="#site-${s.id}">Open ${esc(s.name)}</a></div>` : ''}</div>`;
    }).join('')}</div>
    ${order.length > limit ? `<div class="panel-b" style="border-top:1px solid var(--line-2)"><button class="btn sm" data-act="drill-all">Show all ${order.length} homes</button></div>` : ''}</section>`;
}

function floodWarningsPanel() {
  const head = `<div class="panel-h"><h2>Flood warnings</h2>${floodFeedChip()}</div>`;
  if (!liveOn()) return `<section class="panel" id="t-live">${head}<div class="panel-b"><p class="small muted">Environment Agency warnings are issued by warning area. On the published site a scheduled job checks them every 15 minutes and matches each warning area to the homes inside it. ${LIVE_TRIED ? 'This copy cannot reach that feed, so none is shown here.' : ''}</p></div></section>`;
  if (!LIVE.floods?.ok) return `<section class="panel" id="t-live">${head}<div class="panel-b"><p class="small" style="color:var(--crit)">The Environment Agency feed did not respond at the last check (${fmtT(LIVE.checked)}). Warnings may be in force: check the <a href="https://check-for-flooding.service.gov.uk/" target="_blank" rel="noopener">official service</a>.</p></div></section>`;
  const ws = warningsInScope(), other = warningsAll().length - ws.length;
  const body = ws.length ? `<div class="alist">${ws.map(w => `<div class="aitem" style="align-items:flex-start">${sevChip(w)}
      <div><div class="small" style="font-weight:700">${esc(w.area)}</div>
        <div class="xs faint">${esc(w.water)}${w.water ? ' · ' : ''}raised ${fmtT(w.raised)} · ${w.homes.length} home${w.homes.length === 1 ? '' : 's'} inside: ${w.homes.slice(0, 6).map(id => `<a href="#site-${id}">${esc(BY.get(id).name)}</a>`).join(', ')}${w.homes.length > 6 ? ` and ${w.homes.length - 6} more` : ''}</div>
        ${w.message ? `<div class="xs muted" style="margin-top:4px">${esc(w.message.slice(0, 240))}${w.message.length > 240 ? '…' : ''}</div>` : ''}
        ${w.url ? `<a class="xs" href="${esc(w.url)}" target="_blank" rel="noopener">Official warning</a>` : ''}</div>
      <button class="btn sm primary" data-act="respond" data-id="${esc(w.id)}" ${S.drill ? 'disabled title="Finish the current response first"' : ''}>Start response</button></div>`).join('')}</div>`
    : `<p class="small">No flood warning or alert in force covers any home in scope.</p>`;
  return `<section class="panel" id="t-live">${head}<div class="panel-b">${body}
    <p class="xs faint" style="margin-top:10px">Checked ${fmtT(LIVE.checked)} within ${LIVE.floods.searched_km} km of the estate. ${other > 0 ? `${other} other warning${other === 1 ? '' : 's'} in force nearby cover${other === 1 ? 's' : ''} no home in scope. ` : ''}A home is matched when its address point lies inside the warning area. ${esc(LIVE.attribution || '')}</p></div></section>`;
}

/* ---------------------------------------------------------------- actions */
const AF = { owner: '', overdue: false };
VIEWS.actions = () => {
  const ids = scopeIds();
  const all = S.actions.filter(a => ids.has(a.site));
  const owners = [...new Set(all.map(a => a.owner).filter(Boolean))].sort();
  const f = all.filter(a => (!AF.owner || (AF.owner === '__none' ? !a.owner : a.owner === AF.owner)) && (!AF.overdue || isOverdue(a)));
  const col = (st, label) => {
    const items = f.filter(a => a.status === st).sort((x, y) => (x.due || '').localeCompare(y.due || ''));
    return `<div class="col"><div class="col-h"><span>${label}</span><span class="num">${items.length}</span></div><div class="cards">
      ${items.map(a => { const s = BY.get(a.site); return `<div class="card ${isOverdue(a) ? 'overdue' : ''}">
        <div class="t">${esc(a.title)}</div><div class="s"><a href="#site-${s.id}">${esc(s.name)}</a> · ${esc(s.town)}</div>
        <div class="m"><span class="chip plain">${esc(a.hz)}</span><span>${a.owner ? esc(a.owner) : 'Unassigned'}</span>
          <span>${a.status === 'done' ? 'Done ' + fmt(a.doneAt) : 'Due ' + fmt(a.due)}</span>${isOverdue(a) ? '<span class="chip crit">Overdue</span>' : ''}</div>
        ${a.note ? `<div class="xs muted">${esc(a.note)}</div>` : ''}
        ${a.source === 'suggested' ? '<div class="xs faint">Suggested by TerraScope from mapped hazard</div>' : ''}
        <div class="b">${st === 'todo' ? `<button class="btn sm" data-act="move" data-id="${a.id}" data-to="doing">Start</button>` : ''}
          ${st !== 'done' ? `<button class="btn sm" data-act="move" data-id="${a.id}" data-to="done">Mark done</button>` : `<button class="btn sm" data-act="move" data-id="${a.id}" data-to="todo">Reopen</button>`}
          <button class="btn sm ghost" data-act="edit-action" data-id="${a.id}">Edit</button></div></div>`; }).join('') || '<div class="empty">Nothing here.</div>'}
    </div></div>`;
  };
  return `<div class="phead"><div><h1>Actions</h1><div class="sub">Preparedness work across ${esc(scopeName())}, with owners and due dates. Completed actions go into each home's evidence pack.</div></div>
    <div class="actions-row"><button class="btn primary" data-act="new-action">${I.plus}New action</button></div></div>
  <div class="filters"><div class="field"><label for="af-owner">Owner</label><select id="af-owner"><option value="">Everyone</option><option value="__none" ${AF.owner === '__none' ? 'selected' : ''}>Unassigned</option>
    ${owners.map(o => `<option ${AF.owner === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select></div>
    <label class="chk" style="padding-bottom:7px"><input type="checkbox" id="af-od" ${AF.overdue ? 'checked' : ''}> Overdue only</label>
    <span class="count-line">${f.filter(a => a.status !== 'done').length} open · ${f.filter(a => a.status === 'done').length} done</span></div>
  <div class="board" id="t-board">${col('todo', 'To do')}${col('doing', 'In progress')}${col('done', 'Done')}</div>`;
};
AFTER.actions = () => {
  document.getElementById('af-owner').addEventListener('change', e => { AF.owner = e.target.value; render(); });
  document.getElementById('af-od').addEventListener('change', e => { AF.overdue = e.target.checked; render(); });

function actionModal(a, siteId) {
  const list = inScope();
  const sid = a ? a.site : (siteId || list[0]?.id);
  const close = () => { scr.remove(); };
  const scr = document.createElement('div');
  scr.className = 'scrim';
  scr.innerHTML = `<form class="modal" id="aform" role="dialog" aria-modal="true" aria-labelledby="am-t">
    <div class="panel-h"><h2 id="am-t">${a ? 'Edit action' : 'New action'}</h2></div>
    <div class="panel-b">
      <div class="field"><label for="am-site">Home</label><select id="am-site" ${a ? 'disabled' : ''}>${list.map(s => `<option value="${s.id}" ${s.id === sid ? 'selected' : ''}>${esc(s.name)} · ${esc(s.town)}</option>`).join('')}</select></div>
      <div class="field"><label for="am-title">Action</label><input id="am-title" required value="${esc(a?.title || '')}" placeholder="For example: test the generator under load"></div>
      <div class="grid g-2e" style="gap:10px">
        <div class="field"><label for="am-hz">Hazard</label><select id="am-hz">${['Flood', 'River and sea', 'Surface water', 'Heat', 'Cold', 'Readiness', 'General'].map(h => `<option ${a?.hz === h ? 'selected' : ''}>${h}</option>`).join('')}</select></div>
        <div class="field"><label for="am-due">Due</label><input id="am-due" type="date" value="${esc(a?.due || addDays(14))}"></div></div>
      <div class="field"><label for="am-owner">Owner</label><input id="am-owner" value="${esc(a?.owner || '')}" placeholder="Name or role, for example Registered manager"></div>
      <div class="field"><label for="am-note">Note or evidence</label><textarea id="am-note" placeholder="What was done, or where the evidence is kept">${esc(a?.note || '')}</textarea></div>
    </div>
    <div class="foot">${a ? `<button type="button" class="btn ghost" data-m="del" style="margin-right:auto">Delete</button>` : ''}
      <button type="button" class="btn" data-m="cancel">Cancel</button><button type="submit" class="btn primary">${a ? 'Save changes' : 'Add action'}</button></div></form>`;
  document.body.appendChild(scr);
  scr.querySelector('#am-title').focus();
  let delArmed = false;
  scr.addEventListener('click', e => {
    if (e.target === scr || e.target.dataset.m === 'cancel') close();
    if (e.target.dataset.m === 'del') {
      if (!delArmed) { delArmed = true; e.target.textContent = 'Click again to delete'; return; }
      S.actions = S.actions.filter(x => x.id !== a.id); log(a.site, 'action', `Action deleted: ${a.title}`); save(); close(); render(); toast('Action deleted');
    }
  });
  scr.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  scr.querySelector('#aform').addEventListener('submit', e => {
    e.preventDefault();
    const v = id => scr.querySelector(id).value.trim();
    if (!v('#am-title')) return;
    if (a) { Object.assign(a, { title: v('#am-title'), hz: v('#am-hz'), due: v('#am-due'), owner: v('#am-owner'), note: v('#am-note') }); toast('Action saved'); }
    else {
      const site = v('#am-site');
      S.actions.push({ id: nextId(), site, title: v('#am-title'), hz: v('#am-hz'), due: v('#am-due'), owner: v('#am-owner'),
        note: v('#am-note'), status: 'todo', source: 'user', created: new Date().toISOString() });
      log(site, 'action', `Action added: ${v('#am-title')}`); toast('Action added');
    }
    save(); close(); render();
  });
}

    <h3>2 · Assessment</h3>
    ${p == null ? `<p>Not ranked. No Environment Agency flood band is held for this address yet. A missing band is not treated as low risk.</p>` :
      `<p>Flood priority <b class="mono">${p.toFixed(1)}</b> · ${prioChip(bandOf(p))}</p>

      <tr><td>Surface-water flooding (0.2 m depth or more)</td><td>${s.sw ? esc(s.sw === 'None' ? 'None mapped' : s.sw) + ' (' + FLOOD_DEF[s.sw] + ')' : 'Unknown'}</td><td class="small">EA NaFRA2 RoFSW, address point; joined ${fmt(s.rsq)}</td></tr>

  const reviewed = list.filter(s => readiness(s).reviewed).length;
  return `<div class="phead"><div><div class="crumbs"><a href="#evidence">Evidence</a> / Portfolio report</div><h1>Portfolio report</h1>

/* ---------------------------------------------------------------- method */
VIEWS.method = () => {
  const n = SITES.length;
  const reviewed = SITES.filter(s => readiness(s).reviewed).length;
  const ledger = [

      <p class="mono" style="font-size:14px">cold priority = frost exposure × consequence × cold-weather readiness</p>
      <p><b>Exposure</b> is air frost days a year on a fixed scale where ${COLD_SCALE} days scores 100, so this county’s ${COLD.min} to ${COLD.max} days score ${coldHazard({ cold: COLD.min }).toFixed(0)} to ${coldHazard({ cold: COLD.max }).toFixed(0)}. <b>Consequence</b> is the plan’s general term (nursing, beds): UKHSA found the rise in cold-weather deaths was greatest in care homes (${L('cold', 'cold mortality report')}) but gives no split between nursing and residential, so none is assumed. <b>Readiness</b> uses the cold-weather, continuity, power and mutual-aid answers and any open cold actions.</p>
      <p>Interim because outdoor frost is a weak guide to whether a home can keep living areas at 18°C. For care homes the main input should be the building: energy ratings from EPC and Display Energy Certificates, and the heating backup. The plan’s housing-quality and fuel-poverty measure suits home care, where clients heat their own homes.</p></div></section>
    <section class="panel"><div class="panel-h"><h2>Heat priority</h2><span class="meta">Ranked separately from flood</span></div><div class="panel-b prose">
      <p class="mono" style="font-size:14px">heat priority = heat exposure × dependency × hot-weather readiness</p>
      <p><b>Exposure</b> is warm days (25°C or above) a year on a fixed scale where ${HEAT_SCALE} days scores 100, so this county’s ${HEAT.min} to ${HEAT.max} days score ${heatHazard({ heat: HEAT.min }).toFixed(0)} to ${heatHazard({ heat: HEAT.max }).toFixed(0)}. Stretching the county’s narrow range to 0–100 made one extra warm day worth 20 points, so the scale is fixed and stated, and national reference points replace it after Research Project 1. <b>Dependency</b> runs from 0.90 to 1.25: nursing homes start at 1.15 and residential at 0.90, plus up to 0.10 for size, because heat risk roughly doubles in nursing homes on 25°C days and rises by about half in residential homes (${L('lshtm', 'LSHTM')}). <b>Readiness</b> uses the hot-weather, continuity, power and mutual-aid answers and any open heat actions.</p>
      <p>Heat and flood are ranked separately rather than combined. Combining raw exposure let the most widespread hazard dominate the first prototype, and the reference points that would make a combined index fair need Research Project 1. Two rankings, each explainable, avoid that.</p>
      <p>Limits: outdoor heat varies little across one county, and indoor overheating depends on the building. Joining EPC building data is what will separate two homes on the same street.</p></div></section>
    <section class="panel"><div class="panel-h"><h2>Limits</h2></div><div class="panel-b prose">
      <p>Screening, not a flood risk assessment. Bands describe the likelihood of flooding in the area around a property, not whether water enters the building. The Environment Agency says these products are not for property-level assessment.</p>
      <p>Surface water is measured as the chance of flooding to 0.2 m or deeper at the address point. Shallower water is common and rarely disrupts care; the any-depth extent would flag more homes.</p>
      <p>Not yet validated. Research Project 4 tests the ranking against recorded flood outlines and mortality data, and results are published including where it performs badly.</p>
      <p>Registered beds are capacity, not occupancy. Four records are flagged for identity review.</p>
      <p>No personal data. Every input is a public register or an area statistic.</p></div></section>

document.addEventListener('click', e => {

  if (tr && !e.target.closest('a,button')) { location.hash = tr.dataset.go; return; }
  const t = e.target.closest('[data-act]');

  if (act === 'hide-intro') { S.introHidden = true; save(); render(); }

  if (act === 'sort') { HF.dir = HF.sort === t.dataset.k ? -HF.dir : (['name', 'town', 'type'].includes(t.dataset.k) ? 1 : -1); HF.sort = t.dataset.k; render(); }
  if (act === 'ans' && site) {
    const rec = (S.readiness[site.id] ||= { answers: {} });
    rec.answers[t.dataset.q] = rec.answers[t.dataset.q] === t.dataset.v ? undefined : t.dataset.v;
    if (rec.answers[t.dataset.q] === undefined) delete rec.answers[t.dataset.q];
    t.parentElement.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === rec.answers[t.dataset.q]));
    save(); updatePriority(site, true); renderRail();
  }
  if (act === 'clear-ready' && site) { delete S.readiness[site.id]; save(); render(); toast('Answers cleared'); }
  if (act === 'save-ready' && site) {
    const rec = S.readiness[site.id];
    if (!rec || !Object.keys(rec.answers).length) { toast('Answer at least one question first'); return; }
    rec.reviewedAt = new Date().toISOString();
    const rd = readiness(site), p = priority(site);
    log(site.id, 'review', `Readiness review recorded: ${rd.n} of 6 answered, readiness ×${rd.m.toFixed(2)}${p != null ? `, priority ${p.toFixed(1)} (${bandOf(p)})` : ''}`);
    save(); render(); toast('Review recorded');
  }
  if (act === 'adopt' && site) {
    const g = suggestions(site).filter(x => !S.actions.some(a => a.site === site.id && a.title === x.t))[+t.dataset.i];
    if (g) { S.actions.push({ id: nextId(), site: site.id, title: g.t, hz: g.hz, owner: '', due: addDays(21), status: 'todo', source: 'suggested', created: new Date().toISOString(), note: '' });
      log(site.id, 'action', `Action added: ${g.t}`); save(); render(); toast('Added to the plan'); }
  }
  if (act === 'new-action') actionModal(null, site?.id);

  if (act === 'toggle-done' || act === 'move') {
    const a = S.actions.find(x => x.id === t.dataset.id); if (!a) return;

    a.status = to; a.doneAt = to === 'done' ? new Date().toISOString() : null;
    if (to === 'done') log(a.site, 'action', `Action completed: ${a.title}`);
    save(); render();
    const st = BY.get(a.site), rr = readiness(st), pp = priority(st);
    toast((to === 'done' ? 'Marked done' : to === 'doing' ? 'Started' : 'Reopened') +
      (rr.assessed && pp != null && to !== 'doing' ? ` · ${st.name} priority now ${pp.toFixed(1)}` : ''));
  }
  if (act === 'respond') {
    const w = warningsInScope().find(x => x.id === t.dataset.id); if (!w || S.drill) return;
    S.drill = { kind: 'flood', live: true, title: `${w.severity}, ${w.area}`, homes: w.homes, warning: w.id, started: new Date().toISOString(), items: {}, showAll: false };
    DRILL_OPEN = new Set(w.homes.slice(0, 1));
    save(); render(); document.getElementById('t-scen')?.scrollIntoView({ block: 'start' }); toast('Response started');
  }
  if (act === 'pick-drill') { DRILL_PICK = t.dataset.k; render(); }
  if (act === 'start-drill') {
    const town = DRILL_PICK === 'flood' ? (document.getElementById('drill-town')?.value || DRILL_TOWN) : null;
    S.drill = { kind: DRILL_PICK, town, started: new Date().toISOString(), items: {}, showAll: false };
    DRILL_OPEN = new Set(drillOrder(DRILL_PICK, town).slice(0, 1).map(x => x.s.id));
    save(); render(); toast('Drill started');
  }
  if (act === 'drill-open') { const id = t.dataset.id; DRILL_OPEN.has(id) ? DRILL_OPEN.delete(id) : DRILL_OPEN.add(id); render(); }
  if (act === 'drill-all') { S.drill.showAll = true; save(); render(); }
  if (act === 'drill-check') {
    const it = (S.drill.items[t.dataset.id] ||= []); it[+t.dataset.j] = !it[+t.dataset.j]; save(); render();
  }
  if (act === 'cancel-drill') { S.drill = null; save(); render(); toast('Drill cancelled'); }
  if (act === 'end-drill') {
    const d = S.drill, sc = SCEN[d.kind], order = drillOrder(d.kind, d.town, d.homes);
    let done = 0;
    const title = d.live ? `Response to ${d.title}` : d.kind === 'flood' ? `Flood alert drill, ${d.town}` : `Amber ${sc.name} drill`;
    order.forEach(({ s }) => {
      const c = (d.items[s.id] || []).filter(Boolean).length; done += c;
      if (c) log(s.id, 'drill', `${title}: ${c} of ${sc.checks.length} checks completed`);
    });
    (S.drillLog ||= []).unshift({ at: new Date().toISOString(), kind: d.kind, title, done, total: order.length * sc.checks.length, homes: order.length });
    S.drill = null; save(); render(); toast(d.live ? 'Response recorded in each home\'s evidence' : 'Drill recorded in each home\'s evidence');
  }
  if (act === 'copy-csv') {
    const rows = homesFiltered();
    const head = ['cqc_location_id', 'home', 'provider', 'town', 'postcode', 'service', 'registered_beds', 'river_sea_band', 'surface_water_band', 'flood_priority', 'flood_band', 'warm_days', 'heat_priority', 'heat_band', 'frost_days', 'cold_priority', 'cold_band', 'readiness_reviewed'];
    const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
    copyText([head.join(','), ...rows.map(s => { const p = priority(s); return [s.id, s.name, s.provider, s.town, s.pc, s.type, s.beds, s.rs || '', s.sw || '', priority(s) == null ? '' : priority(s).toFixed(1), bandOf(priority(s)) || 'Awaiting flood data', s.heat, heatPriority(s).toFixed(1), bandOf(heatPriority(s)), s.cold, coldPriority(s).toFixed(1), bandOf(coldPriority(s)), readiness(s).reviewed ? fmt(readiness(s).reviewed) : ''].map(q).join(','); })].join('\n'), `${rows.length} homes copied as CSV`);
  }
  if (act === 'copy-pack' || act === 'copy-report') copyText(document.getElementById('t-doc').innerText, 'Copied as text');
});

async function copyText(txt, msg) {
  try { await navigator.clipboard.writeText(txt); toast(msg); }
  catch (e) {
    const scr = document.createElement('div'); scr.className = 'scrim';
    scr.innerHTML = `<div class="modal"><div class="panel-h"><h2>Copy</h2></div><div class="panel-b"><p class="small muted">Your browser blocked automatic copying. The text is selected below: press Ctrl+C or ⌘C.</p>
      <textarea class="copyarea" readonly>${esc(txt)}</textarea></div><div class="foot"><button class="btn" type="button">Close</button></div></div>`;
    document.body.appendChild(scr);
    const ta = scr.querySelector('textarea'); ta.focus(); ta.select();
    scr.addEventListener('click', ev => { if (ev.target === scr || ev.target.tagName === 'BUTTON') scr.remove(); });
  }
}
let toastT;
function toast(msg) {
  let t = document.getElementById('toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400);
}

/* ---------------------------------------------------------------- tour */
const TOUR = { on: false, i: 0, steps: [
  { route: 'overview', sel: '#t-alerts', t: 'The alert says when', p: 'UKHSA issues heat and cold alerts by region. Every home in the East Midlands gets the same message. It says when to act, never which homes.' },
  { route: 'overview', sel: '#t-priority', t: 'TerraScope says which', p: 'Every registered home in scope, joined to the Environment Agency band at its address and ranked by Care Resilience Priority. Highest first, with the reason on each row.' },
  { route: 'site-' + FEATURE_HOME, sel: '#t-prio', t: 'An explainable score', p: `${BY.get(FEATURE_HOME).name} in ${BY.get(FEATURE_HOME).town} has a ${driver(BY.get(FEATURE_HOME))}, matched on its property reference. Priority is hazard × consequence × readiness, with every term shown so a commissioner can challenge it.` },
  { route: 'site-' + FEATURE_HOME, sel: '#t-ready', t: 'Readiness moves the score', p: 'Answer a few questions as the provider would. The priority moves as you answer, and the range bar shows whether good preparation could change the band. Try it.' },
  { route: 'alerts', sel: '#t-scen', t: 'Practise the response', p: 'Run a drill. A regional alert becomes a response list of named homes, each with checks to tick. Ending the drill writes it into every home\'s record.' },
  { route: 'actions', sel: '#t-board', t: 'Work with owners and dates', p: 'Suggested actions come from each home\'s real hazard data. Assign owners, set dates and mark them done.' },
  { route: 'pack-' + FEATURE_HOME, sel: '#t-doc', t: 'Evidence that it happened', p: 'Every home has a dated evidence pack built from its record: hazards with sources, the readiness review, actions and drills. This is what goes to a commissioner or an inspector.' },
] };
function tourStart() { TOUR.on = true; TOUR.i = 0; tourGo(); }
function tourGo() {
  const st = TOUR.steps[TOUR.i];
  if (location.hash !== '#' + st.route) location.hash = '#' + st.route; else tourHighlight();
  drawTour();
}
function tourHighlight() {
  document.querySelectorAll('.hl').forEach(x => x.classList.remove('hl'));
  const st = TOUR.steps[TOUR.i]; const el = document.querySelector(st.sel);
  if (el) { el.classList.add('hl'); el.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
  drawTour();
}
function drawTour() {
  let box = document.getElementById('tour');
  if (!TOUR.on) { box?.remove(); document.querySelectorAll('.hl').forEach(x => x.classList.remove('hl')); return; }
  if (!box) { box = document.createElement('div'); box.id = 'tour'; box.className = 'tour'; box.setAttribute('role', 'dialog'); box.setAttribute('aria-label', 'Guided tour'); document.body.appendChild(box);
    box.addEventListener('click', e => { const b = e.target.closest('button'); if (!b) return;
      if (b.dataset.t === 'next') { if (TOUR.i < TOUR.steps.length - 1) { TOUR.i++; tourGo(); } else { TOUR.on = false; drawTour(); toast('Tour finished'); } }
      if (b.dataset.t === 'back' && TOUR.i > 0) { TOUR.i--; tourGo(); }
      if (b.dataset.t === 'end') { TOUR.on = false; drawTour(); } }); }
  const st = TOUR.steps[TOUR.i];
  box.innerHTML = `<div class="panel-b"><span class="step">STEP ${TOUR.i + 1} OF ${TOUR.steps.length}</span><h3>${esc(st.t)}</h3><p>${esc(st.p)}</p>
    <div class="nav"><button class="btn sm ghost" data-t="end">End tour</button><span class="actions-row">
      <button class="btn sm" data-t="back" ${TOUR.i ? '' : 'disabled'}>Back</button>
      <button class="btn sm primary" data-t="next">${TOUR.i === TOUR.steps.length - 1 ? 'Finish' : 'Next'}</button></span></div></div>`;
}

/* ---------------------------------------------------------------- boot */
initRail(); initSearch();
document.getElementById('tourbtn').addEventListener('click', tourStart);
if (!location.hash) history.replaceState(null, '', '#overview');
render();
loadLive(); setInterval(loadLive, 5 * 60 * 1000);
